schema_version = "1.0"

[task]
name = "jev-goldfarm-decisions"
version = "0.1.0"
description = """
Decision replay for a Minecraft piglin gold farm driven by TypeSafe's Jev.
Each case is a state recorded from a live client, paired with the actions that
would be reasonable in it. The agent under test is the harness's question
design: state assembly, the verb set offered, the criteria, and the order text.
Scored on the fraction of cases answered with an acceptable action.
"""
keywords = ["minecraft", "typesafe", "jev", "system-one", "decision-making"]

[environment]
# The model call is the whole point, so the network is open to that host only.
network_mode = "allowlist"
allowed_hosts = ["api.typesafe.ai"]
docker_image = "python:3.12-slim"
cpus = 1
memory_mb = 1024

[agent]
timeout_sec = 600

[verifier]
# Prints "SCORE <0..1>" on its last line; the collector reads it as the reward.
command = "python3 /app/benchmark/score.py --cases /app/benchmark/cases.json"
timeout_sec = 900
