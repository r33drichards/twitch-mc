# AutoAddGPU=false stops Xorg from picking up /dev/dri/card0 (the AWS
# simple-framebuffer) and loading modesetting on top of it — without
# this, Xorg would ignore our nvidia Device section.
Section "ServerFlags"
  Option "AutoAddGPU" "false"
  Option "AutoBindGPU" "false"
  # Disable screen blanking. Default BlankTime is 600s — once the
  # screensaver fires, the X drawable goes black and MC's swap-buffers
  # can't wake it back up. Setting all four power-state timers to 0
  # turns the saver off entirely. (DPMS is also off via the Monitor
  # section below; BlankTime is independent of DPMS.)
  Option "BlankTime"   "0"
  Option "StandbyTime" "0"
  Option "SuspendTime" "0"
  Option "OffTime"     "0"
EndSection

Section "ServerLayout"
  Identifier "Layout0"
  Screen 0 "Screen0" 0 0
EndSection

Section "Device"
  Identifier "Device0"
  Driver     "nvidia"
  VendorName "NVIDIA Corporation"
  BusID      "PCI:0:30:0"
  Option     "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Monitor"
  Identifier "Monitor0"
  HorizSync   28.0 - 80.0
  VertRefresh 48.0 - 75.0
  ModeLine    "1280x720" 74.48 1280 1336 1472 1664 720 721 724 746 -HSync +Vsync
  # DPMS disabled — headless server, no monitor to blank
  Option      "DPMS" "false"
EndSection

Section "Screen"
  Identifier "Screen0"
  Device     "Device0"
  Monitor    "Monitor0"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1280x720"
  EndSubSection
EndSection
